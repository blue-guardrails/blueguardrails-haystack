[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "blueguardrails-haystack"
version = "0.1.0"
description = "Trace Haystack LLM and agent calls with Blue Guardrails."
authors = [
    { name = "Mathis Lucka" },
    { name = "Miriam Kümmel" },
]
maintainers = [
    { name = "Blue Guardrails", email = "info@blueguardrails.com" },
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "haystack-ai>=2.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.16.0",
    "opentelemetry-sdk>=1.16.0",
]

[project.optional-dependencies]
integration = [
    "amazon-bedrock-haystack>=6.12.0",
    "anthropic-haystack>=5.7.0",
    "google-genai-haystack>=4.1.0",
    "pytest>=9.0.0",
    "python-dotenv>=1.2.0",
]

[project.urls]
Documentation = "https://docs.blueguardrails.com"
Repository = "https://github.com/blue-guardrails/blueguardrails-haystack"

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.0",
    "ruff>=0.14.0",
]

[tool.uv.build-backend]
module-name = "blueguardrails_haystack"
module-root = "src"
source-include = ["assets/**"]

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "D",  # pydocstyle
]
ignore = [
    "D100", # Ok to not have docstring for public modules
    "D104", # Ok to not have docstring for public packages
    "D105", # Ok to not have docstring for magic methods
    "D401", # First line of docstring does not need to be imperative
]
isort = { combine-as-imports = true, known-first-party = ["blueguardrails_haystack"] }

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src/blueguardrails_haystack"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# The integration intentionally wraps Haystack internals and re-exports private
# compatibility aliases used by downstream users.
reportPrivateUsage = false

[tool.pytest.ini_options]
addopts = "-m 'not integration and not benchmark'"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: tests that make live external provider calls",
    "benchmark: runtime benchmark tests run explicitly with -m benchmark",
]

[tool.coverage.run]
source = ["blueguardrails_haystack"]
branch = true
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
