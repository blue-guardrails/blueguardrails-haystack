[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blueguardrails-haystack"
version = "0.1.0"
description = "Blue Guardrails tracing integration for Haystack"
requires-python = ">=3.10"
dependencies = [
    "haystack-ai",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
]

[project.optional-dependencies]
integration = [
    "pytest",
    "python-dotenv",
    "anthropic-haystack",
    "google-genai-haystack",
    "amazon-bedrock-haystack",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blueguardrails_haystack"]

[tool.pytest.ini_options]
addopts = "-m 'not integration and not benchmark'"
testpaths = [
    "tests/unit",
    "tests/integration",
]
markers = [
    "integration: tests that make live external provider calls",
    "benchmark: runtime benchmark tests run explicitly with -m benchmark",
]
