name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Code quality and tests (Python ${{ matrix.python-version }}, ${{ matrix.haystack }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        haystack: [haystack2, haystack3]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      # The Makefile uses uv run; keep it in the environment selected by the matrix.
      UV_NO_SYNC: "true"
      HAYSTACK_TELEMETRY_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: false
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          HAYSTACK_GROUP: ${{ matrix.haystack }}
        run: uv sync --locked --all-extras --group "$HAYSTACK_GROUP"

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make format-check

      - name: Type check
        run: make types

      - name: Unit tests
        run: make unit

      - name: Integration tests (excluding benchmarks)
        run: make integration
