name: Dependency Management CI

on:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-management-ci.yml"
      - "**/pyproject.toml"
      - "**/uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-management-ci.yml"
      - "**/pyproject.toml"
      - "**/uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: false

      - name: Validate Dependabot schema
        run: |
          curl --fail --location --proto '=https' --retry 3 --silent --show-error \
            https://json.schemastore.org/dependabot-2.0.json -o "$RUNNER_TEMP/dependabot-schema.json"
          uvx --from check-jsonschema==0.39.0 check-jsonschema \
            --schemafile "$RUNNER_TEMP/dependabot-schema.json" .github/dependabot.yml

      - name: Check coverage of Actions and uv projects
        shell: bash
        run: |
          uv run --no-project --with pyyaml==6.0.4 python - <<'PY'
          from pathlib import Path
          import yaml

          updates = yaml.safe_load(Path(".github/dependabot.yml").read_text())["updates"]
          covered = {(u["package-ecosystem"], d) for u in updates
                     for d in u.get("directories", [u.get("directory")])}
          required = {("github-actions", "/")}
          required.update(("uv", (Path("/") / p.parent).as_posix())
                          for p in Path(".").rglob("pyproject.toml"))
          if missing := required - covered:
              raise SystemExit(f"Missing Dependabot coverage: {sorted(missing)}")
          PY
